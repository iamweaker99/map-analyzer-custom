[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.206", features = ["derive"] }
tokio = { version = "1.39.2", features = ["full"] }
osu-map-analyzer = { version = "0.2.9", features = ["serialize"] }
rosu-v2 = { features = ["serialize"], version = "0.9.0" }
rosu-pp = "4.0.1"
reqwest = { version = "0.12.8", features = ["rustls-tls", "json"] }
serde_json = "1.0.128"
itertools = "0.14.0"
md5 = "0.8.0"
axum = "0.8"
bytes = "1"
dotenvy = "0.15.7"
